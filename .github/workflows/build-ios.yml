name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Test & Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project KotatsuIOS.xcodeproj -scheme KotatsuIOS

      - name: Run unit tests on iOS Simulator
        run: |
          SIM_ID=$(xcrun simctl list devices available iPhone --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devs in sorted(data.get("devices", {}).items(), reverse=True):
              for d in devs:
                  if d.get("isAvailable"):
                      print(d["udid"])
                      sys.exit(0)
          ')
          echo "Testing on simulator UDID: $SIM_ID"
          xcodebuild test \
            -project KotatsuIOS.xcodeproj \
            -scheme KotatsuIOS \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Release App (unsigned for Sideloadly/AltStore/SideStore/TrollStore)
        run: |
          xcodebuild build \
            -project KotatsuIOS.xcodeproj \
            -scheme KotatsuIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package .ipa
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/KotatsuIOS.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build output not found at $APP_PATH"
            exit 1
          fi
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          zip -qry "../KotatsuIOS-v9.5.3.ipa" Payload
          ls -lh "../KotatsuIOS-v9.5.3.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: KotatsuIOS-v9.5.3-ipa
          path: build/KotatsuIOS-v9.5.3.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/KotatsuIOS-v9.5.3.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
